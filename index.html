<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d1d">
<title>霓虹疾行 | NEON RUN</title>
<style>
:root{color-scheme:dark;--cyan:#71f4ff;--pink:#ff5dcc;--ink:#080d1d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#f5f8ff}#game{position:fixed;inset:0}#game canvas{display:block;width:100%;height:100%}.vignette{pointer-events:none;position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,8,20,.22),transparent 38%,transparent 72%,rgba(2,5,15,.48)),radial-gradient(ellipse at center,transparent 35%,rgba(2,5,15,.46) 100%)}.hud{position:fixed;z-index:2;inset:0;pointer-events:none;padding:clamp(18px,4vw,40px);display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:12px;font-weight:800;letter-spacing:.25em;color:#def1ffad;text-shadow:0 0 16px #69efff55}.brand strong{display:block;color:#fff;font-size:clamp(18px,3vw,26px);letter-spacing:.12em;margin-top:6px}.stats{display:flex;gap:clamp(14px,3vw,34px);text-align:right}.stat-label{color:#9aa9c8;font-size:10px;letter-spacing:.18em;font-weight:700}.stat-value{font-variant-numeric:tabular-nums;font-size:clamp(20px,4vw,30px);font-weight:800;letter-spacing:.04em;margin-top:4px;text-shadow:0 0 15px #68f4ff55}.stat-value small{font-size:12px;color:var(--cyan);margin-left:3px}.center-layer{position:fixed;z-index:3;inset:0;display:grid;place-items:center;padding:24px}.panel{width:min(450px,100%);text-align:center;padding:clamp(26px,6vw,48px);border:1px solid #9aefff35;border-radius:24px;background:linear-gradient(145deg,#111b32e8,#090f20ed);box-shadow:0 20px 90px #0008,inset 0 1px #ffffff12,0 0 55px #2bd4ff12;backdrop-filter:blur(12px)}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.28em;font-weight:800}h1{font-size:clamp(38px,9vw,62px);line-height:1;letter-spacing:.05em;margin:13px 0 12px;text-shadow:0 0 28px #51e9ff55}.description{color:#adb9d1;line-height:1.8;font-size:14px;margin:0 auto 25px;max-width:330px}.keys{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:0 auto 26px}.key{color:#dce8ff;font-size:11px;border:1px solid #9baecb38;border-radius:8px;padding:8px 10px;background:#ffffff08}.key b{color:var(--cyan)}button{font:inherit;cursor:pointer}#startButton{border:0;border-radius:999px;color:#06101c;background:linear-gradient(100deg,#6ef5ff,#a4ffda);padding:14px 34px;font-weight:900;letter-spacing:.12em;box-shadow:0 8px 30px #52eaff35;transition:transform .15s,filter .15s}#startButton:hover{transform:translateY(-2px);filter:brightness(1.08)}#googleSignInButton{border:1px solid #dce8ff40;border-radius:999px;color:#eef5ff;background:#ffffff0c;padding:12px 22px;font-weight:700;letter-spacing:.04em}#googleSignInButton:hover,#signOutButton:hover{background:#ffffff18}.account-row{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 18px;color:#dce8ff;font-size:13px}.account-name{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.quiet-button{border:1px solid #dce8ff35;border-radius:999px;color:#c5d4ed;background:#ffffff08;padding:7px 12px;font-size:11px}.auth-message{min-height:20px;margin:12px 0 0;color:#ffb6cd;font-size:12px;line-height:1.5}.hidden{display:none}.hint{position:fixed;z-index:2;bottom:24px;left:0;right:0;text-align:center;color:#c4d1eb8a;font-size:11px;letter-spacing:.08em;pointer-events:none}.touch-controls{position:fixed;z-index:2;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));padding:0 22px;display:none;justify-content:space-between;pointer-events:none}.touch-controls button{pointer-events:auto;width:60px;height:60px;border-radius:50%;border:1px solid #b5f5ff66;color:#d9fbff;background:#08142699;backdrop-filter:blur(8px);font-size:21px;box-shadow:0 0 22px #36d9ff1a;touch-action:manipulation}@media(pointer:coarse){.touch-controls{display:flex}.hint{bottom:96px}}@media(max-width:520px){.hud{padding:18px}.brand{font-size:9px}.brand strong{font-size:17px}.stat-label{font-size:8px}.stat-value{font-size:20px}}
</style>
</head>
<body>
<div id="game"></div><div class="vignette"></div>
<div class="hud"><div class="brand">ARCADE SERIES<strong>NEON / RUN</strong></div><div class="stats"><div><div class="stat-label">SCORE</div><div class="stat-value" id="score">000000</div></div><div><div class="stat-label">COINS</div><div class="stat-value" id="coins">0 <small>◆</small></div></div><div><div class="stat-label">BEST</div><div class="stat-value" id="best">000000</div></div></div></div>
<div class="hint" id="hint">SPACE / ↑ 跳躍　　↓ 滑行　　避開迎面而來的障礙</div>
<div class="touch-controls"><button data-action="jump" aria-label="跳躍">↑</button><button data-action="slide" aria-label="滑行">↓</button></div>
<div class="center-layer" id="overlay"><section class="panel"><div class="eyebrow">SIDE SCROLLER · 01</div><h1 id="panelTitle">霓虹疾行</h1><p class="description" id="panelText">在未來街區一路向前，跳過路障、滑過橫桿，收集能量晶片。跑得越遠，速度越快。</p><div class="keys"><span class="key"><b>↑ / SPACE</b> 跳躍</span><span class="key"><b>↓</b> 滑行</span></div><div class="account-row hidden" id="accountRow"><span class="account-name" id="accountName"></span><button class="quiet-button" id="signOutButton" type="button">登出</button></div><button id="googleSignInButton" type="button">使用 Google 登入</button><button id="startButton" class="hidden">開始疾跑</button><p class="auth-message" id="authMessage" aria-live="polite"></p></section></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyD6RdCg6vTumG3UfoIlYCELCIZDpNBkGuE',authDomain:'code2026-403d8.firebaseapp.com',projectId:'code2026-403d8',storageBucket:'code2026-403d8.firebasestorage.app',messagingSenderId:'536806938711',appId:'1:536806938711:web:96c4eb16a664bb1c13eb12'};
const auth=getAuth(initializeApp(firebaseConfig)),googleProvider=new GoogleAuthProvider();googleProvider.setCustomParameters({prompt:'select_account'});
const root=document.querySelector('#game'),scoreEl=document.querySelector('#score'),coinsEl=document.querySelector('#coins'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay'),panelTitle=document.querySelector('#panelTitle'),panelText=document.querySelector('#panelText'),startButton=document.querySelector('#startButton'),googleSignInButton=document.querySelector('#googleSignInButton'),signOutButton=document.querySelector('#signOutButton'),accountRow=document.querySelector('#accountRow'),accountName=document.querySelector('#accountName'),authMessage=document.querySelector('#authMessage');
const VIEW_H=12,groundY=-3.35,clock=new THREE.Clock();let scene,camera,renderer,player,body,head,arms=[],obstacles=[],coins=[],buildings=[],stars=[],roadMarks=[];let running=false,hasEnded=false,jumpY=0,jumpVelocity=0,slideTimer=0,elapsed=0,distance=0,collected=0,score=0,best=Number(localStorage.getItem('neon-run-best')||0),speed=9.5,spawnTimer=0,runnerX=-5,viewW=20;
const fmt=n=>String(Math.floor(n)).padStart(6,'0');bestEl.textContent=fmt(best);
onAuthStateChanged(auth,user=>{const signedIn=Boolean(user);accountRow.classList.toggle('hidden',!signedIn);googleSignInButton.classList.toggle('hidden',signedIn);startButton.classList.toggle('hidden',!signedIn);if(user){accountName.textContent=user.displayName||user.email||'Google 使用者';if(!hasEnded)startButton.textContent='開始疾跑';authMessage.textContent=''}else if(!hasEnded){authMessage.textContent='請先使用 Google 登入以開始遊戲。'}});
googleSignInButton.addEventListener('click',async()=>{googleSignInButton.disabled=true;authMessage.textContent='正在開啟 Google 登入…';try{await signInWithPopup(auth,googleProvider)}catch(error){console.error('Google sign-in failed:',error);const messages={'auth/popup-closed-by-user':'你已關閉 Google 登入視窗。','auth/popup-blocked':'瀏覽器封鎖了登入視窗，請允許彈出式視窗後重試。','auth/unauthorized-domain':'此網站網域尚未加入 Firebase 授權網域。'};authMessage.textContent=messages[error.code]||'Google 登入失敗，請稍後再試。'}finally{googleSignInButton.disabled=false}});
signOutButton.addEventListener('click',async()=>{try{await signOut(auth);authMessage.textContent='已登出。'}catch(error){console.error('Sign-out failed:',error);authMessage.textContent='登出失敗，請稍後再試。'}});
function material(color,emissive=0,intensity=0){return new THREE.MeshStandardMaterial({color,roughness:.72,metalness:.08,emissive,emissiveIntensity:intensity,flatShading:true})}
const M={road:material(0x171d31),ground:material(0x0b1124),edge:material(0x40dfff,0x12cfff,2.2),cyan:material(0x5beeff,0x18caff,1.8),pink:material(0xff54c8,0xff22ad,1.7),suit:material(0x25304d,0x10182c,.4),skin:material(0xffd5c7),orange:material(0xff925f,0xff3e26,1.2),gold:material(0xffdf6a,0xffa900,2),white:material(0xe3f7ff)};
function box(w,h,d,mat){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat)}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x080d1d);scene.fog=new THREE.Fog(0x080d1d,38,100);camera=new THREE.OrthographicCamera(-10,10,6,-6,.1,150);camera.position.set(0,0,30);camera.lookAt(0,0,0);
renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xa5d8ff,0x141126,2.1));const light=new THREE.DirectionalLight(0xdffaff,2.6);light.position.set(-5,10,14);light.castShadow=true;light.shadow.mapSize.set(1024,1024);scene.add(light);const glow=new THREE.PointLight(0x36dcff,20,28);glow.position.set(3,1,8);scene.add(glow);
const ground=box(1000,4,.2,M.ground);ground.position.set(0,groundY-2.15,-1);ground.receiveShadow=true;scene.add(ground);
const track=box(1000,.14,.22,M.road);track.position.set(0,groundY-.06,0);scene.add(track);
const edge=box(1000,.045,.12,M.edge);edge.position.set(0,groundY+.04,.1);scene.add(edge);
for(let i=0,n=Math.ceil((viewW+6)/3);i<n;i++){const mark=box(1.5,.07,.05,material(i%2?0x50617f:0x54dfff,i%2?0:0x19bfff,.9));mark.position.set(-viewW/2+i*3,groundY-.27,.2);scene.add(mark);roadMarks.push(mark)}
resize();createBackdrop();createPlayer();window.addEventListener('resize',resize);window.addEventListener('keydown',onKey);document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();action(b.dataset.action)}));startButton.addEventListener('click',startGame);animate()}
function createBackdrop(){for(let i=0;i<48;i++){const s=new THREE.Mesh(new THREE.CircleGeometry(.018+Math.random()*.035,6),material(0xa9dfff,0x74bfff,1.3));s.position.set((Math.random()-.5)*viewW*1.5,1+Math.random()*4,-8-Math.random()*10);scene.add(s);stars.push(s)}
for(let side=0;side<24;side++){const w=1.6+Math.random()*2.7,h=2.3+Math.random()*5.5,g=new THREE.Group();const b=box(w,h,1,material([0x111b34,0x17233c,0x201b3a,0x112838][Math.floor(Math.random()*4)]));b.position.y=h/2;g.add(b);const stripe=box(.055,h*.75,.035,side%2?M.pink:M.cyan);stripe.position.set(w*.28,h*.53,.54);g.add(stripe);for(let j=0;j<4;j++){const win=box(.12,.12,.04,j%2?M.cyan:M.pink);win.position.set(-w*.25+(j%2)*.35,h*.33+Math.floor(j/2)*.42,.55);g.add(win)}g.position.set(-viewW/2+side*5,groundY-.1,-4);g.userData={speed:.22+Math.random()*.18};scene.add(g);buildings.push(g)}}
function createPlayer(){player=new THREE.Group();player.position.set(runnerX,groundY,.8);scene.add(player);body=new THREE.Mesh(new THREE.CapsuleGeometry(.35,.72,4,8),M.suit);body.position.set(0,1.05,0);body.castShadow=true;player.add(body);head=new THREE.Mesh(new THREE.SphereGeometry(.27,14,10),M.skin);head.position.set(.04,1.78,.04);head.castShadow=true;player.add(head);const visor=box(.42,.12,.08,M.cyan);visor.position.set(.08,1.8,.27);player.add(visor);const jacket=box(.36,.43,.08,M.pink);jacket.position.set(.13,1.13,.28);player.add(jacket);
for(const side of [-1,1]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.095,.44,3,7),M.suit);arm.position.set(side*.4,1.02,.02);arm.rotation.z=side*-.27;arm.castShadow=true;player.add(arm);arms.push(arm);const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.39,3,7),material(0x121a2b));leg.position.set(side*.16,.4,.03);player.add(leg);const shoe=box(.32,.14,.34,M.cyan);shoe.position.set(side*.17,.11,.15);player.add(shoe)}const light=new THREE.PointLight(0x42eaff,2.2,3);light.position.set(.2,1,.4);player.add(light)}
function addObstacle(kind,x){const g=new THREE.Group();g.position.set(x,groundY,.5);if(kind==='crate'){const block=box(1.05,1.25,.7,M.orange);block.position.y=.62;block.castShadow=true;g.add(block);const stripe=box(1.08,.15,.73,M.gold);stripe.position.set(0,.65,.38);g.add(stripe);g.userData={kind,half:.53}}
else if(kind==='hurdle'){const bar=box(1.4,.38,.42,M.cyan);bar.position.set(0,.2,.25);bar.castShadow=true;g.add(bar);for(const x2 of [-.55,.55]){const foot=box(.13,.3,.36,M.orange);foot.position.set(x2,.15,.1);g.add(foot)}g.userData={kind,half:.72}}
else{const beam=box(1.55,.22,.42,M.orange);beam.position.set(0,1.45,.12);g.add(beam);for(const x2 of [-.68,.68]){const post=box(.11,1.5,.32,M.cyan);post.position.set(x2,.75,.1);g.add(post)}g.userData={kind,half:.8}}
scene.add(g);obstacles.push(g)}
function addCoin(x,y){const g=new THREE.Group();g.position.set(x,y,.7);const ring=new THREE.Mesh(new THREE.TorusGeometry(.25,.075,7,16),M.gold);ring.castShadow=true;g.add(ring);const core=new THREE.Mesh(new THREE.CircleGeometry(.11,8),M.white);core.position.z=.04;g.add(core);g.userData={phase:Math.random()*6.28};scene.add(g);coins.push(g)}
function resize(){if(!camera||!renderer)return;const aspect=innerWidth/innerHeight;viewW=VIEW_H*aspect;camera.left=-viewW/2;camera.right=viewW/2;camera.top=VIEW_H/2;camera.bottom=-VIEW_H/2;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);runnerX=-Math.min(viewW*.27,5);if(player&&!running)player.position.x=runnerX;roadMarks.forEach((m,i)=>{if(!running)m.position.x=-viewW/2+i*3})}
function startGame(){if(!auth.currentUser){authMessage.textContent='請先使用 Google 登入以開始遊戲。';return}hasEnded=false;obstacles.forEach(o=>scene.remove(o));coins.forEach(c=>scene.remove(c));obstacles=[];coins=[];elapsed=distance=collected=score=0;speed=9.5;jumpY=jumpVelocity=slideTimer=0;spawnTimer=.9;running=true;player.position.set(runnerX,groundY,.8);overlay.classList.add('hidden');scoreEl.textContent=fmt(0);coinsEl.innerHTML='0 <small>◆</small>';clock.getDelta()}
function endGame(){running=false;hasEnded=true;if(score>best){best=score;localStorage.setItem('neon-run-best',best);bestEl.textContent=fmt(best)}panelTitle.textContent='跑得漂亮';panelText.innerHTML=`本次得分 <strong style="color:#71f4ff">${fmt(score)}</strong><br>收集了 ${collected} 枚能量晶片，再挑戰一次吧。`;startButton.textContent='再跑一次';overlay.classList.remove('hidden')}
function action(type){if(!running)return;if(type==='jump'&&jumpY<=.02&&slideTimer<=0)jumpVelocity=10.2;if(type==='slide'&&jumpY<.4)slideTimer=.72}
function onKey(e){if(['ArrowUp','ArrowDown',' ','Space'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='ArrowUp'||e.key===' '||e.key.toLowerCase()==='w')action('jump');if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')action('slide')}
function update(dt){elapsed+=dt;speed=Math.min(16,9.5+elapsed*.18);distance+=speed*dt;score=Math.floor(distance*10)+collected*100;scoreEl.textContent=fmt(score);coinsEl.innerHTML=`${collected} <small>◆</small>`;
jumpY+=jumpVelocity*dt;if(jumpY>0||jumpVelocity>0){jumpVelocity-=24*dt;if(jumpY<0){jumpY=0;jumpVelocity=0}}slideTimer=Math.max(0,slideTimer-dt);player.position.y=groundY+jumpY;const duck=slideTimer>0;body.scale.y=duck?.56:1;body.position.y=duck?.7:1.05;head.position.y=duck?1.22:1.78;arms.forEach((a,i)=>a.rotation.z=(i?-.25:.25)+Math.sin(elapsed*15+i*Math.PI)*.24);
for(const m of roadMarks){m.position.x-=speed*dt;if(m.position.x<-viewW/2-2)m.position.x+=viewW+6}
for(const b of buildings){b.position.x-=speed*dt*b.userData.speed;if(b.position.x<-viewW/2-5)b.position.x+=viewW+10}
for(const s of stars){s.position.x-=speed*dt*.06;if(s.position.x<-viewW/2-1)s.position.x=viewW/2+1}
spawnTimer-=dt;if(spawnTimer<=0){const x=viewW/2+1.2,roll=Math.random();addObstacle(roll<.48?'crate':roll<.75?'hurdle':'gate',x);if(Math.random()<.62){const y=groundY+1.2+Math.random()*1.5;for(let i=0;i<4;i++)addCoin(x+2+i*.72,y+Math.sin(i*.65)*.25)}spawnTimer=Math.max(.82,1.55-Math.max(0,speed-9.5)*.035+Math.random()*.55)}
for(const o of obstacles){o.position.x-=speed*dt;if(!o.userData.hit&&Math.abs(o.position.x-runnerX)<o.userData.half+.55){const kind=o.userData.kind,safe=kind==='gate'?duck:kind==='hurdle'?jumpY>.72:jumpY>1.18;if(!safe){endGame();return}o.userData.hit=true}}
for(const c of coins){c.position.x-=speed*dt;c.rotation.y+=dt*2.7;c.position.y+=Math.sin(elapsed*4+c.userData.phase)*dt*.14;if(!c.userData.hit&&Math.abs(c.position.x-runnerX)<.58&&Math.abs(c.position.y-(groundY+jumpY+1.15))<1.45){c.userData.hit=true;collected++;scene.remove(c)}}
obstacles=obstacles.filter(o=>{if(o.position.x<-viewW/2-3){scene.remove(o);return false}return true});coins=coins.filter(c=>{if(c.userData.hit||c.position.x<-viewW/2-3){scene.remove(c);return false}return true})}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(running)update(dt);else if(player)player.position.y=groundY+Math.sin(performance.now()*.002)*.035;renderer.render(scene,camera)}
init();
</script>
</body>
</html>
