  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    :root{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#2e382f;background:#f4f0e7;font-synthesis:none;text-rendering:optimizeLegibility;--green:#425d4c;--line:#ded7c7;--muted:#807d70;--paper:#f7f3e9;--ink:#2e382f;--accent:#a55f48}
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #6caa8e80;outline-offset:2px}[hidden]{display:none!important}
    .login-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 14% 8%,#e6e4d5 0,transparent 42%),#f4f0e7}.login-card{width:min(410px,100%);padding:42px 38px;text-align:center;background:var(--paper);border:1px solid #e0d9c9;border-radius:5px;box-shadow:0 22px 70px #282a2014}.brand-mark{width:46px;height:46px;display:grid;place-items:center;margin:0 auto 17px;border-radius:50%;background:var(--green);color:#f5f0df;font-family:"Noto Serif TC",serif;font-size:21px}.login-card h1{margin:0;font-family:"Noto Serif TC","Songti TC",serif;font-size:25px;font-weight:500;letter-spacing:.08em}.login-card p{margin:11px 0 25px;color:var(--muted);font-size:13px;line-height:1.8}.google-button{width:100%;display:flex;align-items:center;justify-content:center;gap:11px;padding:13px 16px;border:1px solid #d5cebd;border-radius:4px;background:#faf7ee;color:#29342e;font-weight:600}.google-button:hover{background:#f2eddf}.google-button:disabled{opacity:.65;cursor:wait}.google-g{font-size:18px;font-weight:800;color:#4285f4}.login-hint{min-height:20px;margin:13px 0 0!important;color:#a64b44!important;font-size:12px!important}
    .app-shell{height:100vh;height:100dvh;min-height:460px;display:flex;flex-direction:column}.topbar{height:72px;flex:none;display:flex;align-items:center;gap:28px;padding:0 28px;border-bottom:1px solid #d9d2c1;background:#f5f1e7}.brand{display:flex;align-items:center;gap:11px;min-width:max-content;color:#2f4034;font-family:"Noto Serif TC","Songti TC",serif;font-size:17px;font-weight:500;letter-spacing:.08em}.brand-mark.small{width:36px;height:36px;margin:0;border:1px solid #9da48c;border-radius:50%;font-size:15px}.brand-title small{display:block;margin-top:2px;color:#858371;font-family:Georgia,serif;font-size:8px;letter-spacing:.19em}.search-wrap{position:relative;width:min(340px,38vw);margin-left:auto}.search-input{width:100%;height:38px;padding:0 13px;border:1px solid #d8d1c1;border-radius:3px;background:#f9f6ee;color:#26332a;font-size:12px}.search-input::placeholder{color:#8c8979}.search-results{position:absolute;top:44px;left:0;right:0;z-index:5;display:grid;gap:2px;max-height:260px;overflow:auto;padding:5px;border:1px solid #ddd5c4;border-radius:4px;background:#f8f4e9;box-shadow:0 12px 32px #282a201a}.search-results:empty{display:none}.search-result{width:100%;padding:9px 10px;border:0;border-radius:3px;background:transparent;color:#354239;text-align:left;font-family:"Noto Serif TC",serif;font-size:12px}.search-result:hover,.search-result:focus-visible{background:#ece9da}.account{display:flex;align-items:center;gap:9px;min-width:max-content}.avatar{width:31px;height:31px;border-radius:50%;object-fit:cover;background:#e5eee8}.account-email{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#69766d;font-size:11px}.text-button{padding:7px 9px;border:0;border-radius:3px;background:transparent;color:#68756d;font-size:11px}.text-button:hover{background:#eae6d9}.map-stage{position:relative;flex:1;min-height:0;background:#ece8dc}.map-canvas{position:absolute;inset:0}.map-actions{position:absolute;z-index:3;top:17px;right:18px;display:flex;gap:7px}.map-button{min-height:35px;padding:7px 12px;border:1px solid #d5cbb6;border-radius:3px;background:#f7f2e6ed;color:#4b5b4a;font-family:"Noto Serif TC",serif;font-size:11px;box-shadow:0 3px 10px #302d2012;backdrop-filter:blur(8px)}.map-button:hover,.map-button[aria-pressed="true"]{background:#fbf7eb;color:#304937}.map-caption{position:absolute;z-index:2;left:18px;bottom:14px;padding:5px 9px;border-left:2px solid #9e6e50;background:#f7f2e5d9;color:#777565;font-family:"Noto Serif TC",serif;font-size:10px;letter-spacing:.04em;pointer-events:none}.map-loading{position:absolute;inset:0;z-index:2;display:grid;place-items:center;color:#627067;font-size:13px;pointer-events:none}.map-loading span{padding:11px 15px;border:1px solid #d5cbb6;border-radius:3px;background:#f7f2e5eb}.maplibregl-ctrl-group{overflow:hidden;border:1px solid #d5cbb6!important;border-radius:3px!important;box-shadow:0 3px 10px #302d2012!important}.maplibregl-ctrl-group button{width:33px;height:33px;background-color:#f7f2e5ed!important}.maplibregl-ctrl-attrib{border-radius:5px 0 0 0;background:#f7f2e5d9!important;color:#555b4e!important;font-size:9px!important}.maplibregl-ctrl-attrib a{color:#52634e!important}.maplibregl-popup-content{padding:8px 12px;border:1px solid #d7ccb7;border-radius:3px;background:#f7f2e6;color:#344037;font-family:"Noto Serif TC",serif;font-size:12px;box-shadow:0 5px 18px #302d2022}.maplibregl-popup-tip{border-top-color:#f7f2e6!important}.gate-marker{display:flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid #bda98d;border-radius:3px;background:#f8f2e4;color:#384b3e;font-family:"Noto Serif TC",serif;font-size:12px;letter-spacing:.04em;white-space:nowrap;box-shadow:0 3px 11px #302d2025}.gate-marker:hover{background:#fff9eb}.gate-marker-dot{width:8px;height:8px;border-radius:50%;background:#a55f48;box-shadow:0 0 0 3px #a55f4824}.gate-marker-back .gate-marker-dot{background:#627861;box-shadow:0 0 0 3px #62786124}
    .road-key{display:inline-flex;align-items:center;gap:7px;margin-right:8px;color:#646b59}.road-key::before{content:"";width:17px;height:2px;background:#a98b64;box-shadow:0 0 0 2px #f7f2e5;display:inline-block;vertical-align:middle}
    @media(max-width:640px){.topbar{height:auto;min-height:64px;flex-wrap:wrap;gap:8px 12px;padding:8px 12px}.brand{font-size:14px}.brand-mark.small{width:31px;height:31px}.search-wrap{order:3;width:100%;margin:0}.account{margin-left:auto;gap:5px}.account-email{display:none}.map-stage{min-height:0}.map-actions{top:10px;right:10px}.map-caption{bottom:10px;left:10px}}
  </style>
</head>
<body>
  <section id="loginGate" class="login-screen" aria-labelledby="loginTitle">
    <div class="login-card">
      <div class="brand-mark" aria-hidden="true">中</div>
      <h1 id="loginTitle">中央大學 3D 校園地圖</h1>
      <p>使用 Google 帳號登入後瀏覽校區。</p>
      <button id="googleSignInButton" class="google-button" type="button"><span class="google-g" aria-hidden="true">G</span>使用 Google 帳號登入</button>
      <p id="loginMessage" class="login-hint" aria-live="polite"></p>
    </div>
  </section>

  <script>
    if (window.location.protocol === 'file:') {
      document.getElementById('googleSignInButton').disabled = true;
      document.getElementById('loginMessage').textContent = '目前是直接開啟 index.html（file://），Firebase 登入無法運作。請改用 GitHub Pages 或本機網站伺服器；若使用 localhost，請在 Firebase 授權網域加入 localhost（不含連接埠）。';
    }
  </script>

  <div id="appShell" class="app-shell" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-mark small" aria-hidden="true">中</span><span class="brand-title">中大・校園漫遊<small>A CAMPUS ATLAS</small></span></div>
      <label class="search-wrap"><input id="placeSearch" class="search-input" type="search" placeholder="尋一處建築" autocomplete="off" aria-label="搜尋建築" aria-expanded="false" aria-controls="searchResults"><div id="searchResults" class="search-results" role="listbox" aria-label="建築搜尋結果"></div></label>
      <div class="account"><img id="userAvatar" class="avatar" alt="" hidden><span id="userEmail" class="account-email"></span><button id="signOutButton" class="text-button" type="button">登出</button></div>
    </header>
    <main class="map-stage" aria-label="中央大學校區 3D 地圖">
      <div id="map" class="map-canvas" role="application" aria-label="可旋轉與縮放的校園地圖"></div>
      <div id="mapLoading" class="map-loading"><span>載入校園地圖…</span></div>
      <div class="map-actions"><button id="viewModeButton" class="map-button" type="button" aria-pressed="true">切換平面</button><button id="resetViewButton" class="map-button" type="button">回到校區</button></div>
      <div class="map-caption"><span class="road-key">校園道路</span>沿著林蔭漫遊 · 建築高度為示意</div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
    import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyD6RdCg6vTumG3UfoIlYCELCIZDpNBkGuE',
      authDomain: 'code2026-403d8.firebaseapp.com',
      projectId: 'code2026-403d8',
      storageBucket: 'code2026-403d8.firebasestorage.app',
      messagingSenderId: '536806938711',
      appId: '1:536806938711:web:96c4eb16a664bb1c13eb12'
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();
    googleProvider.setCustomParameters({ prompt: 'select_account' });
    const $ = (selector) => document.querySelector(selector);
    const loginGate = $('#loginGate');
    const appShell = $('#appShell');
    const mapLoading = $('#mapLoading');
    let map;
    let mapStarted = false;
    let buildingFeatures = [];
    let gateCoordinates = [];
    let campusBounds;
    let selectedId;
    let selectedPopup;
    let threeDimensional = true;

    function getFootprintArea(feature) {
      const ring = feature.geometry.coordinates && feature.geometry.coordinates[0];
      if (!ring || ring.length < 4) return 100;
      let twiceArea = 0;
      let latitude = 0;
      for (let i = 0; i < ring.length - 1; i++) {
        twiceArea += ring[i][0] * ring[i + 1][1] - ring[i + 1][0] * ring[i][1];
        latitude += ring[i][1];
      }
      latitude /= ring.length - 1;
      return Math.abs(twiceArea / 2) * 111320 * 111320 * Math.cos(latitude * Math.PI / 180);
    }

    function setBuildingHeights(features) {
      features.forEach((feature) => {
        const knownHeight = Number(feature.properties.height) || 0;
        const knownLevels = Number(feature.properties.levels) || 0;
        const illustrativeHeight = Math.max(7, Math.min(25, 6 + Math.sqrt(getFootprintArea(feature)) * 0.36));
        feature.properties.mapHeight = knownHeight || (knownLevels ? knownLevels * 3.2 : Math.round(illustrativeHeight * 10) / 10);
      });
    }

    function centerOf(feature) {
      const ring = feature.geometry.coordinates[0];
      let longitude = 0;
      let latitude = 0;
      const count = ring.length - 1;
      for (let i = 0; i < count; i++) { longitude += ring[i][0]; latitude += ring[i][1]; }
      return [longitude / count, latitude / count];
    }

    function selectBuilding(feature, moveMap = true) {
      if (selectedId !== undefined) map.setFeatureState({ source: 'campus', id: selectedId }, { selected: false });
      selectedId = feature.id;
      map.setFeatureState({ source: 'campus', id: selectedId }, { selected: true });
      const center = centerOf(feature);
      const label = feature.properties.name || '校園建築';
      if (selectedPopup) selectedPopup.remove();
      selectedPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 8 }).setLngLat(center).setText(label).addTo(map);
      if (moveMap) map.flyTo({ center, zoom: 17.4, pitch: threeDimensional ? 58 : 0, duration: 750 });
    }

    function renderSearchResults() {
      const input = $('#placeSearch');
      const results = $('#searchResults');
      const query = input.value.trim().toLocaleLowerCase();
      results.replaceChildren();
      if (!query) { input.setAttribute('aria-expanded', 'false'); return; }
      const matches = buildingFeatures.filter((feature) => (feature.properties.name || '').toLocaleLowerCase().includes(query)).slice(0, 8);
      input.setAttribute('aria-expanded', String(matches.length > 0));
      matches.forEach((feature) => {
        const item = document.createElement('button');
        item.className = 'search-result';
        item.type = 'button';
        item.setAttribute('role', 'option');
        item.textContent = feature.properties.name;
        item.addEventListener('click', () => {
          input.value = feature.properties.name;
          results.replaceChildren();
          input.setAttribute('aria-expanded', 'false');
          selectBuilding(feature);
        });
        results.append(item);
      });
    }

    function setMapMessage(message) {
      mapLoading.hidden = false;
      mapLoading.replaceChildren();
      const label = document.createElement('span');
      label.textContent = message;
      mapLoading.append(label);
    }

    function addGateMarkers(gates) {
      gates.forEach((gate) => {
        const marker = document.createElement('button');
        marker.type = 'button';
        marker.className = 'gate-marker' + (gate.properties.entrance === 'back' ? ' gate-marker-back' : '');
        marker.setAttribute('aria-label', '前往中央大學' + gate.properties.name);
        const dot = document.createElement('span');
        dot.className = 'gate-marker-dot';
        dot.setAttribute('aria-hidden', 'true');
        const text = document.createElement('span');
        text.textContent = gate.properties.name;
        marker.append(dot, text);
        const coordinates = gate.geometry.coordinates;
        marker.addEventListener('click', (event) => {
          event.stopPropagation();
          map.flyTo({ center: coordinates, zoom: 16.6, pitch: threeDimensional ? 58 : 0, duration: 700 });
        });
        new maplibregl.Marker({ element: marker, anchor: 'bottom' }).setLngLat(coordinates).addTo(map);
      });
    }

    function calculateCampusBounds(features) {
      const bounds = [Infinity, Infinity, -Infinity, -Infinity];
      const visit = (coordinates) => {
        if (!Array.isArray(coordinates)) return;
        if (typeof coordinates[0] === 'number' && typeof coordinates[1] === 'number') {
          bounds[0] = Math.min(bounds[0], coordinates[0]);
          bounds[1] = Math.min(bounds[1], coordinates[1]);
          bounds[2] = Math.max(bounds[2], coordinates[0]);
          bounds[3] = Math.max(bounds[3], coordinates[1]);
          return;
        }
        coordinates.forEach(visit);
      };
      features.forEach((feature) => visit(feature.geometry.coordinates));
      if (!Number.isFinite(bounds[0])) return [[121.1835, 24.9645], [121.2020, 24.9730]];
      const longitudePadding = 0.00035;
      const latitudePadding = 0.00025;
      return [[bounds[0] - longitudePadding, bounds[1] - latitudePadding], [bounds[2] + longitudePadding, bounds[3] + latitudePadding]];
    }

    function wholeCampusBounds() {
      return campusBounds || [[121.1835, 24.9645], [121.2020, 24.9730]];
    }

    function keepCampusAndGatesInView() {
      if (!map || !gateCoordinates.length) return;
      const [[west, south], [east, north]] = wholeCampusBounds();
      const points = [
        [west, south], [west, north], [east, south], [east, north],
        ...gateCoordinates
      ];
      const width = map.getContainer().clientWidth;
      const height = map.getContainer().clientHeight;
      const safe = { left: 66, right: width - 180, top: 72, bottom: height - 64 };

      for (let attempt = 0; attempt < 5; attempt++) {
        const projected = points.map((point) => map.project(point));
        const minX = Math.min(...projected.map((point) => point.x));
        const maxX = Math.max(...projected.map((point) => point.x));
        const minY = Math.min(...projected.map((point) => point.y));
        const maxY = Math.max(...projected.map((point) => point.y));
        const fits = minX >= safe.left && maxX <= safe.right && minY >= safe.top && maxY <= safe.bottom;
        if (fits) return;

        const scale = Math.min(1, (safe.right - safe.left) / (maxX - minX), (safe.bottom - safe.top) / (maxY - minY));
        const targetX = Math.max(safe.left + (maxX - minX) / 2, Math.min(safe.right - (maxX - minX) / 2, (minX + maxX) / 2));
        const targetY = Math.max(safe.top + (maxY - minY) / 2, Math.min(safe.bottom - (maxY - minY) / 2, (minY + maxY) / 2));
        const center = map.unproject([targetX, targetY]);
        const zoom = Math.max(12.8, map.getZoom() + (scale < 0.99 ? Math.log2(scale * 0.92) : 0));
        map.jumpTo({ center: [center.lng, center.lat], zoom, pitch: map.getPitch(), bearing: map.getBearing() });
      }
    }

    function fitCampus(duration = 0, pitch = 48) {
      if (!map) return;
      map.resize();
      const camera = map.cameraForBounds(wholeCampusBounds(), {
        padding: { top: 82, right: 118, bottom: 76, left: 66 },
        bearing: -12,
        pitch,
        maxZoom: 15.6
      });
      if (!camera) return;
      camera.pitch = pitch;
      camera.bearing = -12;
      if (duration) {
        map.easeTo({ ...camera, duration });
        map.once('moveend', keepCampusAndGatesInView);
      } else {
        map.jumpTo(camera);
        keepCampusAndGatesInView();
      }
    }

    async function startMap() {
      if (mapStarted) { map.resize(); return; }
      mapStarted = true;
      if (!window.maplibregl) { setMapMessage('地圖元件載入失敗，請重新整理。'); return; }
      map = new maplibregl.Map({
        container: 'map',
        center: [121.19155, 24.96844],
        zoom: 15.8,
        pitch: 58,
        bearing: -15,
        maxPitch: 68,
        maxBounds: [[121.1828, 24.9638], [121.2028, 24.9738]],
        attributionControl: true,
        style: { version: 8, sources: {}, layers: [{ id: 'background', type: 'background', paint: { 'background-color': '#e8eee5' } }] }
      });
      map.addControl(new maplibregl.NavigationControl({ showCompass: true, showZoom: true, visualizePitch: true }), 'top-right');
      map.on('load', async () => {
        try {
          const response = await fetch('data/ncu-campus.geojson');
          if (!response.ok) throw new Error('Campus GeoJSON request failed: ' + response.status);
          const data = await response.json();
          buildingFeatures = data.features.filter((feature) => feature.properties.kind === 'building');
          const gates = data.features.filter((feature) => feature.properties.kind === 'gate');
          gateCoordinates = gates.map((feature) => feature.geometry.coordinates);
          campusBounds = calculateCampusBounds(data.features.filter((feature) => feature.properties.kind !== 'gate'));
          setBuildingHeights(buildingFeatures);
          map.addSource('campus', { type: 'geojson', data, attribution: '© OpenStreetMap contributors' });
          map.addLayer({ id: 'campus-green', source: 'campus', type: 'fill', filter: ['==', ['get', 'kind'], 'green'], paint: { 'fill-color': '#a4b193', 'fill-opacity': 0.72 } });
          map.addLayer({ id: 'campus-water', source: 'campus', type: 'fill', filter: ['==', ['get', 'kind'], 'water'], paint: { 'fill-color': '#a5c2bc', 'fill-opacity': 0.83 } });
          map.addLayer({ id: 'campus-road-casing', source: 'campus', type: 'line', filter: ['==', ['get', 'kind'], 'road'], paint: { 'line-color': '#f3ecdf', 'line-width': ['interpolate', ['linear'], ['zoom'], 14, 3, 18, 6], 'line-opacity': 0.96 } });
          map.addLayer({ id: 'campus-roads', source: 'campus', type: 'line', filter: ['==', ['get', 'kind'], 'road'], paint: { 'line-color': '#bba07b', 'line-width': ['interpolate', ['linear'], ['zoom'], 14, 1.2, 18, 2.7], 'line-opacity': 0.88 } });
          map.addLayer({
            id: 'campus-buildings', source: 'campus', type: 'fill-extrusion', filter: ['==', ['get', 'kind'], 'building'],
            paint: {
              'fill-extrusion-color': ['case', ['boolean', ['feature-state', 'selected'], false], '#a55f48', '#c6baa6'],
              'fill-extrusion-height': ['to-number', ['get', 'mapHeight']],
              'fill-extrusion-base': 0,
              'fill-extrusion-opacity': 0.98
            }
          });
          addGateMarkers(gates);
          map.on('click', 'campus-buildings', (event) => { if (event.features && event.features[0]) selectBuilding(event.features[0], false); });
          map.on('mouseenter', 'campus-buildings', () => { map.getCanvas().style.cursor = 'pointer'; });
          map.on('mouseleave', 'campus-buildings', () => { map.getCanvas().style.cursor = ''; });
          fitCampus();
          mapLoading.hidden = true;
        } catch (error) {
          console.error('Campus map failed to load:', error);
          setMapMessage('校園圖資載入失敗，請重新整理。');
        }
      });
    }

    $('#googleSignInButton').addEventListener('click', async () => {
      const button = $('#googleSignInButton');
      button.disabled = true;
      $('#loginMessage').textContent = '正在開啟 Google 登入…';
      try { await signInWithPopup(auth, googleProvider); }
      catch (error) {
        console.error('Google sign-in failed:', error);
        const messages = {
          'auth/popup-closed-by-user': '你已關閉登入視窗。',
          'auth/popup-blocked': '瀏覽器封鎖登入視窗，請允許後重試。',
          'auth/unauthorized-domain': 'Firebase 尚未授權目前網站網域。請到 Authentication → Settings → Authorized domains 加入該網域。',
          'auth/operation-not-allowed': 'Firebase 尚未啟用 Google 登入，請到 Authentication → Sign-in method 啟用 Google。',
          'auth/network-request-failed': '網路連線失敗，請檢查網路後重試。'
        };
        $('#loginMessage').textContent = messages[error.code] || `登入失敗（${error.code || '未知錯誤'}），請檢查 Firebase Authentication 設定後重試。`;
      } finally { button.disabled = false; }
    });
    $('#signOutButton').addEventListener('click', async () => { try { await signOut(auth); } catch (error) { console.error('Sign-out failed:', error); } });
    onAuthStateChanged(auth, (user) => {
      loginGate.hidden = Boolean(user);
      appShell.hidden = !user;
      if (!user) return;
      $('#userEmail').textContent = user.displayName || user.email || 'Google 使用者';
      const avatar = $('#userAvatar');
      if (user.photoURL) { avatar.src = user.photoURL; avatar.hidden = false; }
      else { avatar.removeAttribute('src'); avatar.hidden = true; }
      requestAnimationFrame(() => startMap());
    });
    $('#placeSearch').addEventListener('input', renderSearchResults);
    $('#placeSearch').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        const query = event.currentTarget.value.trim().toLocaleLowerCase();
        const feature = buildingFeatures.find((item) => (item.properties.name || '').toLocaleLowerCase().includes(query));
        if (feature) { $('#searchResults').replaceChildren(); event.currentTarget.setAttribute('aria-expanded', 'false'); selectBuilding(feature); }
      }
      if (event.key === 'Escape') { $('#searchResults').replaceChildren(); event.currentTarget.setAttribute('aria-expanded', 'false'); }
    });
    $('#viewModeButton').addEventListener('click', (event) => {
      threeDimensional = !threeDimensional;
      event.currentTarget.textContent = threeDimensional ? '切換平面' : '切換立體';
      event.currentTarget.setAttribute('aria-pressed', String(threeDimensional));
      if (map && map.getLayer('campus-buildings')) map.easeTo({ pitch: threeDimensional ? 58 : 0, duration: 450 });
    });
    $('#resetViewButton').addEventListener('click', () => {
      if (threeDimensional) fitCampus(700, 48);
      else fitCampus(700, 0);
      if (selectedId !== undefined) map.setFeatureState({ source: 'campus', id: selectedId }, { selected: false });
      selectedId = undefined;
      if (selectedPopup) selectedPopup.remove();
      selectedPopup = null;
      $('#placeSearch').value = '';
      $('#searchResults').replaceChildren();
    });
  </script>
</body>
</html>
