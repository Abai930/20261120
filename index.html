  <style>

nk);font-weight:800;letter-spacing:.015em}.brand .brand-mark{width:34px;height:34px;margin:0;border-radius:11px;font-size:17px}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.account{display:flex;align-items:center;gap:12px}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#e5eee8}.account-email{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#536058;font-size:13px}.text-button{padding:8px 11px;border:0;border-radius:9px;background:transparent;color:#68756d;font-size:12px}.text-button:hover{background:#eef2ee;color:var(--ink)}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 76px)}.sidebar{padding:30px 18px;border-right:1px solid var(--line);background:#fbfcfb}.new-task-link{width:100%;display:flex;align-items:center;gap:10px;padding:13px 15px;border:0;border-radius:12px;background:var(--green);color:white;font-size:14px;font-weight:700;box-shadow:0 5px 12px #26745c21}.new-task-link:hover{background:var(--green-dark)}.plus{font-size:19px;font-weight:400;line-height:1}.nav-label{margin:30px 11px 10px;color:#9aa39c;font-size:10px;font-weight:750;letter-spacing:.14em}.nav-list{display:grid;gap:4px}.nav-item{width:100%;display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border:0;border-radius:10px;background:transparent;color:#5f6b63;text-align:left;font-size:13px}.nav-item:hover{background:#f1f4f1}.nav-item.active{background:var(--mint);color:var(--green-dark);font-weight:700}.nav-item .nav-label-text{display:flex;align-items:center;gap:10px}.nav-icon{width:18px;text-align:center;font-size:15px}.nav-count{color:#99a39c;font-size:11px}.sidebar-note{margin-top:42px;padding:15px 13px;border:1px solid #e5ede7;border-radius:13px;background:#f7faf7;color:#68756d;font-size:11px;line-height:1.7}.sidebar-note strong{display:block;margin-bottom:4px;color:#3b5948;font-size:12px}.main{width:min(920px,100%);margin:0 auto;padding:42px 48px 70px}.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:27px}.eyebrow{margin:0 0 7px;color:var(--green);font-size:10px;font-weight:800;letter-spacing:.16em}.page-heading h1{margin:0;font-size:clamp(28px,4vw,38px);letter-spacing:-.04em}.date-line{margin:8px 0 0;color:var(--muted);font-size:13px}.task-total{flex:none;color:#758079;font-size:12px}.capture-card{padding:18px;border:1px solid #e6ebe6;border-radius:17px;background:var(--paper);box-shadow:var(--shadow)}.capture-title{display:flex;align-items:center;gap:12px}.capture-title input{flex:1;min-width:0;padding:9px 2px;border:0;background:transparent;color:var(--ink);font-size:15px}.capture-title input::placeholder{color:#aab2ac}.capture-fields{display:grid;grid-template-columns:minmax(0,1fr) 150px 138px auto;gap:10px;align-items:center;margin-top:12px;padding-top:13px;border-top:1px solid #f0f2f0}.capture-fields input,.capture-fields select,.edit-form input,.edit-form textarea,.edit-form select{width:100%;padding:9px 11px;border:1px solid #e8ece8;border-radius:9px;background:#fbfcfb;color:#435048;font-size:12px}.capture-fields input::placeholder,.edit-form input::placeholder,.edit-form textarea::placeholder{color:#a6aea8}.add-button{padding:10px 15px;border:0;border-radius:9px;background:#e8f3ed;color:#21634d;font-size:12px;font-weight:750;white-space:nowrap}.add-button:hover{background:#dcece2}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:30px 0 13px}.toolbar-left{display:flex;align-items:center;gap:9px}.toolbar h2{margin:0;font-size:15px;font-weight:750}.search-box{width:min(240px,42vw);position:relative}.search-box input{width:100%;padding:9px 12px 9px 34px;border:1px solid #e5eae5;border-radius:10px;background:#fff;color:var(--ink);font-size:12px}.search-box span{position:absolute;left:12px;top:8px;color:#98a29a;font-size:15px}.clear-button{padding:8px;border:0;background:transparent;color:#9a6257;font-size:11px}.clear-button:hover{color:#9b4437}.task-list{display:grid;gap:9px}.task-card{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:start;gap:13px;padding:16px 17px;border:1px solid #e7ebe7;border-radius:14px;background:var(--paper);box-shadow:0 5px 18px #18342106;transition:border-color .15s,transform .15s}.task-card:hover{border-color:#d4e1d7;transform:translateY(-1px)}.task-check{appearance:none;width:19px;height:19px;margin:2px 0 0;border:1.5px solid #c6d1c8;border-radius:50%;background:white;cursor:pointer}.task-check:checked{border-color:var(--green);background:var(--green);box-shadow:inset 0 0 0 4px white}.task-body{min-width:0}.task-title{margin:0;color:#2f3933;font-size:14px;font-weight:650;line-height:1.5;overflow-wrap:anywhere}.task-note{margin:5px 0 0;color:#7e8981;font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.task-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:7px;background:#f3f5f3;color:#758079;font-size:10px}.chip.due-soon{background:#fff3e9;color:#ad6537}.chip.overdue{background:#fff0ed;color:#ac5345}.chip.priority-high{background:#fff0ed;color:#ac5345}.chip.priority-low{background:#f1f3f1;color:#7e8981}.task-actions{display:flex;gap:3px;opacity:.72}.icon-button{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#7c8780;font-size:14px}.icon-button:hover{background:#f1f4f1;color:#344038}.icon-button.delete:hover{background:#fff0ed;color:#aa5143}.completed .task-title{text-decoration:line-through;color:#97a19a}.completed .task-note{color:#a5ada7}.empty-state{padding:52px 20px;text-align:center;border:1px dashed #dce4dd;border-radius:15px;background:#fafcfb}.empty-icon{width:47px;height:47px;display:grid;place-items:center;margin:0 auto 13px;border-radius:16px;background:#eaf3ed;color:var(--green);font-size:22px}.empty-state h3{margin:0;color:#3a463e;font-size:14px}.empty-state p{margin:7px 0 0;color:#87928a;font-size:12px}.save-status{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:22px;color:#9aa49c;font-size:10px}.save-dot{width:6px;height:6px;border-radius:50%;background:#78aa8b}.modal-backdrop{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:#17251c66;backdrop-filter:blur(3px)}.modal-card{width:min(480px,100%);padding:23px;border:1px solid #e5ebe6;border-radius:18px;background:#fff;box-shadow:0 22px 70px #14271b2b}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.modal-head h2{margin:0;font-size:18px}.modal-close{width:30px;height:30px;border:0;border-radius:8px;background:#f3f5f3;color:#647168;font-size:18px}.edit-form{display:grid;gap:12px}.edit-form label{display:grid;gap:6px;color:#657168;font-size:11px;font-weight:650}.edit-form input,.edit-form textarea,.edit-form select{font-size:13px}.edit-form textarea{min-height:90px;resize:vertical;line-height:1.6}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}.cancel-button,.save-button{padding:10px 15px;border-radius:9px;font-size:12px;font-weight:700}.cancel-button{border:1px solid #e3e8e3;background:white;color:#657168}.save-button{border:1px solid var(--green);background:var(--green);color:white}.toast{position:fixed;z-index:20;left:50%;bottom:24px;transform:translate(-50%,15px);padding:11px 16px;border-radius:10px;background:#26362d;color:#f6fff8;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}.toast.show{transform:translate(-50%,0);opacity:1}
    @media(max-width:760px){.topbar{height:66px;padding:0 18px}.layout{grid-template-columns:1fr;min-height:calc(100vh - 66px)}.sidebar{display:flex;gap:10px;align-items:center;padding:12px 18px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}.new-task-link{width:auto;flex:none;padding:10px 13px}.nav-label,.sidebar-note{display:none}.nav-list{display:flex;gap:3px;min-width:max-content}.nav-item{width:auto;gap:8px;padding:9px 10px}.nav-count{display:none}.main{padding:30px 20px 55px}.capture-fields{grid-template-columns:1fr 1fr}.capture-fields input:first-child{grid-column:1/-1}.capture-fields .add-button{grid-column:1/-1}.topbar{padding:0 16px}.account-email{max-width:140px}.page-heading{align-items:flex-start}.task-total{margin-top:8px}}
    @media(max-width:460px){.login-card{padding:36px 24px}.brand small{display:none}.brand{font-size:14px}.account{gap:6px}.account-email{display:none}.page-heading h1{font-size:29px}.main{padding-right:14px;padding-left:14px}.toolbar{align-items:flex-start;flex-direction:column}.toolbar-left{width:100%;justify-content:space-between}.search-box{width:100%}.task-card{grid-template-columns:22px minmax(0,1fr) auto;padding:14px 12px;gap:9px}.task-actions{opacity:1}.icon-button{width:27px;height:27px}.capture-card{padding:14px}.capture-fields{gap:8px}}
  </style>
</head>
<body>
  <section id="loginGate" class="login-screen" aria-labelledby="loginTitle">
    <div class="login-card">
      <div class="brand-mark" aria-hidden="true">✓</div>
      <h1 id="loginTitle">拾記</h1>
      <p class="subtitle">把想做的事一件件寫下來。<br>登入後開始整理你的每日待辦。</p>
      <button id="googleSignInButton" class="google-button" type="button"><span class="google-g" aria-hidden="true">G</span>使用 Google 帳號登入</button>
      <p id="loginMessage" class="login-hint" aria-live="polite"></p>
    </div>
  </section>

  <div id="appShell" class="app-shell" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✓</span><span>拾記<small>DAILY NOTEBOOK</small></span></div>
      <div class="account"><img id="userAvatar" class="avatar" alt="" hidden><span id="userEmail" class="account-email"></span><button id="signOutButton" class="text-button" type="button">登出</button></div>
    </header>
    <div class="layout">
      <aside class="sidebar" aria-label="待辦篩選">
        <button id="focusAddButton" class="new-task-link" type="button"><span class="plus">＋</span>新增待辦</button>
        <div>
          <div class="nav-label">檢視</div>
          <nav id="filterNav" class="nav-list">
            <button class="nav-item active" type="button" data-filter="all"><span class="nav-label-text"><span class="nav-icon">▦</span>全部待辦</span><span id="countAll" class="nav-count">0</span></button>
            <button class="nav-item" type="button" data-filter="today"><span class="nav-label-text"><span class="nav-icon">◷</span>今天到期</span><span id="countToday" class="nav-count">0</span></button>
            <button class="nav-item" type="button" data-filter="upcoming"><span class="nav-label-text"><span class="nav-icon">▧</span>之後處理</span><span id="countUpcoming" class="nav-count">0</span></button>
            <button class="nav-item" type="button" data-filter="done"><span class="nav-label-text"><span class="nav-icon">✓</span>已完成</span><span id="countDone" class="nav-count">0</span></button>
          </nav>
        </div>
        <div class="sidebar-note"><strong>留一點空間給自己</strong>一件一件完成，就已經很棒了。</div>
      </aside>

      <main class="main">
        <section class="page-heading">
          <div><p class="eyebrow">MY SPACE</p><h1 id="pageTitle">全部待辦</h1><p id="dateLine" class="date-line"></p></div>
          <span id="taskTotal" class="task-total"></span>
        </section>

        <form id="quickAddForm" class="capture-card">
          <div class="capture-title"><span class="plus" aria-hidden="true" style="color:#26745c">＋</span><input id="quickTitle" name="title" maxlength="140" placeholder="記下一件待辦…" aria-label="待辦事項標題" required></div>
          <div class="capture-fields">
            <input id="quickNote" name="note" maxlength="1000" placeholder="補充備註（選填）" aria-label="備註">
            <input id="quickDue" name="dueDate" type="date" aria-label="到期日">
            <select id="quickPriority" name="priority" aria-label="優先程度"><option value="normal">一般優先</option><option value="high">高優先</option><option value="low">低優先</option></select>
            <button class="add-button" type="submit">加入待辦</button>
          </div>
        </form>

        <div class="toolbar">
          <div class="toolbar-left"><h2 id="listHeading">待辦清單</h2><button id="clearCompletedButton" class="clear-button" type="button" hidden>清除已完成</button></div>
          <label class="search-box"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="搜尋待辦與備註" aria-label="搜尋待辦與備註"></label>
        </div>
        <div id="taskList" class="task-list" aria-live="polite"></div>
      <p class="save-status"><span class="save-dot" aria-hidden="true"></span><span id="saveStatus">待辦會同步儲存在雲端</span></p>
      </main>
    </div>
  </div>

  <div id="editModal" class="modal-backdrop" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editHeading">
      <div class="modal-head"><h2 id="editHeading">編輯待辦</h2><button id="closeEditButton" class="modal-close" type="button" aria-label="關閉">×</button></div>
      <form id="editForm" class="edit-form">
        <input id="editId" type="hidden">
        <label>待辦事項<input id="editTitle" maxlength="140" required></label>
        <label>備註<textarea id="editNote" maxlength="1000" placeholder="補充細節或想法"></textarea></label>
        <label>到期日<input id="editDue" type="date"></label>
        <label>優先程度<select id="editPriority"><option value="normal">一般優先</option><option value="high">高優先</option><option value="low">低優先</option></select></label>
        <div class="modal-actions"><button id="cancelEditButton" class="cancel-button" type="button">取消</button><button class="save-button" type="submit">儲存變更</button></div>
      </form>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
    import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
    import { collection, deleteDoc, doc, getFirestore, onSnapshot, updateDoc, writeBatch, addDoc } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyD6RdCg6vTumG3UfoIlYCELCIZDpNBkGuE',
      authDomain: 'code2026-403d8.firebaseapp.com',
      projectId: 'code2026-403d8',
      storageBucket: 'code2026-403d8.firebasestorage.app',
      messagingSenderId: '536806938711',
      appId: '1:536806938711:web:96c4eb16a664bb1c13eb12'
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();
    googleProvider.setCustomParameters({ prompt: 'select_account' });

    const $ = (selector) => document.querySelector(selector);
    const loginGate = $('#loginGate');
    const appShell = $('#appShell');
    const loginMessage = $('#loginMessage');
    const quickAddForm = $('#quickAddForm');
    const taskList = $('#taskList');
    const searchInput = $('#searchInput');
    const editModal = $('#editModal');
    const toast = $('#toast');
    const STORAGE_PREFIX = 'shiji-notebook-v1:';
    const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    let currentUser = null;
    let tasks = [];
    let activeFilter = 'all';
    let toastTimer;
    let stopTaskSync = null;

    const filterTitles = { all: '全部待辦', today: '今天到期', upcoming: '之後處理', done: '已完成' };
    const priorityLabels = { high: '高優先', normal: '一般', low: '低優先' };
    const localDateLine = new Intl.DateTimeFormat('zh-TW', { dateStyle: 'full' }).format(new Date());
    $('#dateLine').textContent = localDateLine;

    function localStorageKey(uid) { return `${STORAGE_PREFIX}${uid}`; }
    function migrationKey(uid) { return `${STORAGE_PREFIX}${uid}:migrated-to-firestore`; }
    function loadLocalTasks(uid) {
      try {
        const saved = localStorage.getItem(localStorageKey(uid));
        const parsed = saved ? JSON.parse(saved) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        console.error('Unable to read notebook data:', error);
        return [];
      }
    }
    function taskCollection(uid = currentUser.uid) { return collection(db, 'users', uid, 'tasks'); }
    function taskDocument(taskId, uid = currentUser.uid) { return doc(db, 'users', uid, 'tasks', taskId); }
    function handleFirestoreError(error) {
      console.error('Firestore operation failed:', error);
      $('#saveStatus').textContent = '雲端同步發生問題';
      const messages = {
        'permission-denied': 'Firestore 權限不足，請確認 Rules 已發布。',
        'unavailable': '目前無法連線，請檢查網路後重試。',
        'not-found': '找不到 Firestore 資料庫，請確認已建立資料庫。'
      };
      showToast(messages[error.code] || '雲端同步失敗，請稍後再試');
    }
    async function migrateLocalTasks(uid, remoteCollection) {
      const marker = migrationKey(uid);
      if (localStorage.getItem(marker)) return false;
      const localTasks = loadLocalTasks(uid);
      if (!localTasks.length) { localStorage.setItem(marker, 'true'); return false; }
      $('#saveStatus').textContent = '正在匯入此裝置的待辦…';
      for (let start = 0; start < localTasks.length; start += 450) {
        const batch = writeBatch(db);
        localTasks.slice(start, start + 450).forEach(task => {
          const id = typeof task.id === 'string' && task.id ? task.id : crypto.randomUUID();
          batch.set(doc(remoteCollection, id), {
            title: String(task.title || '未命名待辦'),
            note: String(task.note || ''),
            dueDate: String(task.dueDate || ''),
            priority: ['high', 'normal', 'low'].includes(task.priority) ? task.priority : 'normal',
            done: Boolean(task.done),
            createdAt: Number(task.createdAt) || Date.now(),
            completedAt: Number(task.completedAt) || 0
          });
        });
        await batch.commit();
      }
      localStorage.setItem(marker, 'true');
      showToast(`已匯入 ${localTasks.length} 件本機待辦`);
      return true;
    }
    function startTaskSync(user) {
      if (stopTaskSync) stopTaskSync();
      const remoteCollection = taskCollection(user.uid);
      let checkedInitialServerSnapshot = false;
      $('#saveStatus').textContent = '正在連線至 Firestore…';
      stopTaskSync = onSnapshot(remoteCollection, { includeMetadataChanges: true }, async snapshot => {
        if (!snapshot.metadata.fromCache && !checkedInitialServerSnapshot) {
          checkedInitialServerSnapshot = true;
          if (snapshot.empty) {
            try { if (await migrateLocalTasks(user.uid, remoteCollection)) return; }
            catch (error) { handleFirestoreError(error); }
          }
        }
        tasks = snapshot.docs.map(item => ({ id: item.id, ...item.data() }));
        render();
        $('#saveStatus').textContent = snapshot.metadata.fromCache
          ? '顯示離線資料，連線後會同步'
          : snapshot.metadata.hasPendingWrites ? '正在同步至雲端…' : '已同步至雲端';
      }, handleFirestoreError);
    }
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }
    function countTasks() {
      return {
        all: tasks.filter(task => !task.done).length,
        today: tasks.filter(task => !task.done && task.dueDate === today).length,
        upcoming: tasks.filter(task => !task.done && task.dueDate && task.dueDate > today).length,
        done: tasks.filter(task => task.done).length
      };
    }
    function getVisibleTasks() {
      const query = searchInput.value.trim().toLocaleLowerCase();
      return tasks.filter(task => {
        const matchesFilter = activeFilter === 'all' ? !task.done
          : activeFilter === 'today' ? !task.done && task.dueDate === today
          : activeFilter === 'upcoming' ? !task.done && task.dueDate && task.dueDate > today
          : task.done;
        const text = `${task.title} ${task.note || ''}`.toLocaleLowerCase();
        return matchesFilter && (!query || text.includes(query));
      }).sort((a, b) => {
        if (activeFilter === 'done') return (b.completedAt || 0) - (a.completedAt || 0);
        if (a.dueDate && b.dueDate && a.dueDate !== b.dueDate) return a.dueDate.localeCompare(b.dueDate);
        if (a.dueDate && !b.dueDate) return -1;
        if (!a.dueDate && b.dueDate) return 1;
        return (b.createdAt || 0) - (a.createdAt || 0);
      });
    }
    function makeChip(text, className = '') {
      const chip = document.createElement('span');
      chip.className = `chip ${className}`.trim();
      chip.textContent = text;
      return chip;
    }
    function renderTask(task) {
      const card = document.createElement('article');
      card.className = `task-card${task.done ? ' completed' : ''}`;
      const checkbox = document.createElement('input');
      checkbox.className = 'task-check';
      checkbox.type = 'checkbox';
      checkbox.checked = Boolean(task.done);
      checkbox.dataset.action = 'toggle';
      checkbox.dataset.id = task.id;
      checkbox.setAttribute('aria-label', task.done ? '標記為未完成' : '標記為已完成');
      const body = document.createElement('div');
      body.className = 'task-body';
      const title = document.createElement('h3');
      title.className = 'task-title';
      title.textContent = task.title;
      body.append(title);
      if (task.note) {
        const note = document.createElement('p');
        note.className = 'task-note';
        note.textContent = task.note;
        body.append(note);
      }
      const meta = document.createElement('div');
      meta.className = 'task-meta';
      if (task.dueDate) {
        const due = new Date(`${task.dueDate}T00:00:00`);
        const label = new Intl.DateTimeFormat('zh-TW', { month: 'numeric', day: 'numeric' }).format(due);
        const dueClass = !task.done && task.dueDate < today ? 'overdue' : !task.done && task.dueDate === today ? 'due-soon' : '';
        meta.append(makeChip(`${dueClass === 'overdue' ? '逾期 · ' : dueClass ? '今天 · ' : '到期 · '}${label}`, dueClass));
      }
      meta.append(makeChip(priorityLabels[task.priority] || '一般', `priority-${task.priority || 'normal'}`));
      body.append(meta);

      const actions = document.createElement('div');
      actions.className = 'task-actions';
      const edit = document.createElement('button');
      edit.className = 'icon-button';
      edit.type = 'button';
      edit.dataset.action = 'edit';
      edit.dataset.id = task.id;
      edit.setAttribute('aria-label', '編輯待辦');
      edit.title = '編輯';
      edit.textContent = '✎';
      const remove = document.createElement('button');
      remove.className = 'icon-button delete';
      remove.type = 'button';
      remove.dataset.action = 'delete';
      remove.dataset.id = task.id;
      remove.setAttribute('aria-label', '刪除待辦');
      remove.title = '刪除';
      remove.textContent = '×';
      actions.append(edit, remove);
      card.append(checkbox, body, actions);
      return card;
    }
    function render() {
      const counts = countTasks();
      $('#countAll').textContent = counts.all;
      $('#countToday').textContent = counts.today;
      $('#countUpcoming').textContent = counts.upcoming;
      $('#countDone').textContent = counts.done;
      $('#pageTitle').textContent = filterTitles[activeFilter];
      $('#listHeading').textContent = activeFilter === 'all' ? '待辦清單' : filterTitles[activeFilter];
      $('#taskTotal').textContent = `${counts.all} 件未完成`;
      $('#clearCompletedButton').hidden = counts.done === 0;
      document.querySelectorAll('[data-filter]').forEach(button => button.classList.toggle('active', button.dataset.filter === activeFilter));
      taskList.replaceChildren();
      const visible = getVisibleTasks();
      if (!visible.length) {
        const empty = document.createElement('section');
        empty.className = 'empty-state';
        const icon = document.createElement('div');
        icon.className = 'empty-icon';
        icon.textContent = activeFilter === 'done' ? '✓' : '✦';
        const heading = document.createElement('h3');
        heading.textContent = searchInput.value ? '沒有找到符合的待辦' : activeFilter === 'done' ? '還沒有完成的事項' : activeFilter === 'today' ? '今天沒有到期事項' : activeFilter === 'upcoming' ? '目前沒有排定日期的待辦' : '清單還很清爽';
        const detail = document.createElement('p');
        detail.textContent = searchInput.value ? '試試其他關鍵字。' : activeFilter === 'all' ? '把待辦寫下來，讓思緒輕一點。' : '有新的事情時，再記在這裡。';
        empty.append(icon, heading, detail);
        taskList.append(empty);
      } else {
        visible.forEach(task => taskList.append(renderTask(task)));
      }
    }
    async function addTask(values) {
      const title = values.title.trim();
      if (!title) return;
      await addDoc(taskCollection(), { title, note: values.note.trim(), dueDate: values.dueDate, priority: values.priority || 'normal', done: false, createdAt: Date.now(), completedAt: 0 });
      showToast('已加入待辦');
    }
    function openEditor(task) {
      $('#editId').value = task.id;
      $('#editTitle').value = task.title;
      $('#editNote').value = task.note || '';
      $('#editDue').value = task.dueDate || '';
      $('#editPriority').value = task.priority || 'normal';
      editModal.hidden = false;
      $('#editTitle').focus();
    }

    $('#googleSignInButton').addEventListener('click', async () => {
      const button = $('#googleSignInButton');
      button.disabled = true;
      loginMessage.textContent = '正在開啟 Google 登入…';
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (error) {
        console.error('Google sign-in failed:', error);
        const messages = {
          'auth/popup-closed-by-user': '你已關閉登入視窗。',
          'auth/popup-blocked': '瀏覽器封鎖了登入視窗，請允許彈出式視窗後重試。',
          'auth/unauthorized-domain': '此網站網域尚未加入 Firebase 授權網域。'
        };
        loginMessage.textContent = messages[error.code] || '登入失敗，請稍後再試。';
      } finally {
        button.disabled = false;
      }
    });

    $('#signOutButton').addEventListener('click', async () => {
      try { await signOut(auth); } catch (error) { console.error('Sign-out failed:', error); showToast('登出失敗，請稍後再試'); }
    });
    onAuthStateChanged(auth, user => {
      currentUser = user;
      loginGate.hidden = Boolean(user);
      appShell.hidden = !user;
      if (!user) {
        if (stopTaskSync) stopTaskSync();
        stopTaskSync = null;
        tasks = [];
        taskList.replaceChildren();
        return;
      }
      $('#userEmail').textContent = user.displayName || user.email || 'Google 使用者';
      const avatar = $('#userAvatar');
      if (user.photoURL) { avatar.src = user.photoURL; avatar.hidden = false; }
      else { avatar.removeAttribute('src'); avatar.hidden = true; }
      $('#saveStatus').textContent = '正在連線至 Firestore…';
      tasks = [];
      render();
      startTaskSync(user);
    });

    $('#filterNav').addEventListener('click', event => {
      const button = event.target.closest('[data-filter]');
      if (!button) return;
      activeFilter = button.dataset.filter;
      render();
    });
    $('#focusAddButton').addEventListener('click', () => $('#quickTitle').focus());
    quickAddForm.addEventListener('submit', async event => {
      event.preventDefault();
      const data = new FormData(quickAddForm);
      const submitButton = quickAddForm.querySelector('[type="submit"]');
      submitButton.disabled = true;
      try {
        await addTask({ title: data.get('title'), note: data.get('note'), dueDate: data.get('dueDate'), priority: data.get('priority') });
        quickAddForm.reset();
        $('#quickTitle').focus();
      } catch (error) { handleFirestoreError(error); }
      finally { submitButton.disabled = false; }
    });
    searchInput.addEventListener('input', render);
    taskList.addEventListener('change', async event => {
      const checkbox = event.target.closest('[data-action="toggle"]');
      if (!checkbox) return;
      const task = tasks.find(item => item.id === checkbox.dataset.id);
      if (!task) return;
      try { await updateDoc(taskDocument(task.id), { done: checkbox.checked, completedAt: checkbox.checked ? Date.now() : 0 }); }
      catch (error) { handleFirestoreError(error); }
    });
    taskList.addEventListener('click', async event => {
      const button = event.target.closest('[data-action="edit"],[data-action="delete"]');
      if (!button) return;
      const task = tasks.find(item => item.id === button.dataset.id);
      if (!task) return;
      if (button.dataset.action === 'edit') openEditor(task);
      else if (confirm(`確定刪除「${task.title}」嗎？`)) {
        try { await deleteDoc(taskDocument(task.id)); showToast('已刪除待辦'); }
        catch (error) { handleFirestoreError(error); }
      }
    });
    $('#editForm').addEventListener('submit', async event => {
      event.preventDefault();
      const task = tasks.find(item => item.id === $('#editId').value);
      if (!task) return;
      try {
        await updateDoc(taskDocument(task.id), { title: $('#editTitle').value.trim(), note: $('#editNote').value.trim(), dueDate: $('#editDue').value, priority: $('#editPriority').value });
        editModal.hidden = true;
        showToast('已儲存變更');
      } catch (error) { handleFirestoreError(error); }
    });
    $('#cancelEditButton').addEventListener('click', () => { editModal.hidden = true; });
    $('#closeEditButton').addEventListener('click', () => { editModal.hidden = true; });
    editModal.addEventListener('click', event => { if (event.target === editModal) editModal.hidden = true; });
    $('#clearCompletedButton').addEventListener('click', async () => {
      const completedTasks = tasks.filter(task => task.done);
      if (!completedTasks.length || !confirm(`確定清除 ${completedTasks.length} 件已完成事項嗎？`)) return;
      try {
        for (let start = 0; start < completedTasks.length; start += 450) {
          const batch = writeBatch(db);
          completedTasks.slice(start, start + 450).forEach(task => batch.delete(taskDocument(task.id)));
          await batch.commit();
        }
        showToast('已清除完成事項');
      } catch (error) { handleFirestoreError(error); }
    });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') editModal.hidden = true; });
  </script>
</body>
</html>
